spring:
  ai:
    ollama:
      base-url: http://localhost:11434

      embedding:
        model: nomic-embed-text   # ✅ IMPORTANT

      chat:
        model: mistral            # ✅ for chat
  datasource:
    url: jdbc:postgresql://localhost:5433/ai_db
    username: postgres
    password: postgres 

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

