name: Build, Test, and Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # -----------------------------------------------------------
  # 1. BUILD & TEST JOB
  # -----------------------------------------------------------
  build-and-test:
    runs-on: ubuntu-latest

    # Optional: If your tests connect to the PostgreSQL pgvector database,
    # GitHub Actions can spin it up as a service container:
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: ai_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Step 1: Checkout repository code
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Set up Java 17 with Maven caching
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # Step 3: Grant execute permission for the Maven wrapper
      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # Step 4: Run unit & integration tests
      - name: Run Tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ai_db
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./mvnw clean test

      # Step 5: Package the application into an executable JAR
      - name: Build JAR package
        run: ./mvnw package -DskipTests

      # Step 6: Save the built JAR as a workflow artifact
      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  # -----------------------------------------------------------
  # 2. DEPLOY JOB (Runs only when tests pass on 'main')
  # -----------------------------------------------------------
  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download JAR from build job
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      # ---------------------------------------------------------
      # Pick your deployment strategy below:
      # ---------------------------------------------------------

      # OPTION A: Deploy via SSH to an EC2/VPS server
      # - name: Deploy to Server via SSH
      #   uses: appleboy/ssh-action@v1.0.3
      #   with:
      #     host: ${{ secrets.SERVER_HOST }}
      #     username: ${{ secrets.SERVER_USER }}
      #     key: ${{ secrets.SERVER_SSH_KEY }}
      #     script: |
      #       cd /app
      #       git pull origin main
      #       docker compose up -d --build

